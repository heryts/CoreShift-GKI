name: Apply Re-Kernel driver
description: Vendor Re-Kernel (Sakion-Team/Re-Kernel, LKM-Source) as a built-in driver instead of an out-of-tree module.
inputs:
  kernel_version:
    required: false
    default: ""
    description: Kernel version being patched (currently informational only).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        DRIVER_DIR="$COMMON_DIR/drivers/rekernel"

        echo "== Re-Kernel driver (built-in) =="
        TMP_DIR="$(mktemp -d)"
        git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git "$TMP_DIR/Re-Kernel"

        SRC_DIR="$TMP_DIR/Re-Kernel/LKM-Source"
        for required in Kconfig Makefile rekernel.h rekernel_internal.h \
          rekernel_main.c rekernel_binder.c rekernel_netfilter.c \
          rekernel_netlink.c rekernel_signal.c; do
          if [ ! -f "$SRC_DIR/$required" ]; then
            echo "::error::missing Re-Kernel source file: $SRC_DIR/$required"
            rm -rf "$TMP_DIR"
            exit 1
          fi
        done

        rm -rf "$DRIVER_DIR"
        mkdir -p "$DRIVER_DIR"
        cp "$SRC_DIR"/*.c "$SRC_DIR"/*.h "$SRC_DIR/Kconfig" "$SRC_DIR/Makefile" "$DRIVER_DIR/"
        rm -rf "$TMP_DIR"

        echo "== upstream Makefile (obj-m, out-of-tree) =="
        cat "$DRIVER_DIR/Makefile"

        echo
        echo "== patch Makefile: obj-m -> obj-\$(CONFIG_REKERNEL), built-in =="
        if ! grep -qE '^obj-m[[:space:]]*:=[[:space:]]*rekernel\.o' "$DRIVER_DIR/Makefile"; then
          echo "::error::Re-Kernel Makefile format changed upstream; expected 'obj-m := rekernel.o' as the first assignment. Update this action's sed pattern to match the new Makefile."
          exit 1
        fi
        sed -i 's/^obj-m[[:space:]]*:=[[:space:]]*rekernel\.o/obj-$(CONFIG_REKERNEL) += rekernel.o/' "$DRIVER_DIR/Makefile"

        echo
        echo "== patched Makefile =="
        cat "$DRIVER_DIR/Makefile"

        cd "$COMMON_DIR"

        if [ ! -f drivers/Kconfig ]; then
          echo "::error::drivers/Kconfig not found under $COMMON_DIR"
          exit 1
        fi
        if ! grep -qF 'source "drivers/rekernel/Kconfig"' drivers/Kconfig; then
          sed -i '/^endmenu$/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
        fi

        if [ ! -f drivers/Makefile ]; then
          echo "::error::drivers/Makefile not found under $COMMON_DIR"
          exit 1
        fi
        if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile; then
          echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> drivers/Makefile
        fi

        echo
        echo "== Re-Kernel Kconfig/Makefile wiring =="
        grep -n 'rekernel' drivers/Kconfig drivers/Makefile
