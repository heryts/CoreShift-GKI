name: Apply KernelSU Coccinelle manual hooks
description: Apply devnoname120/kernelsu-coccinelle scope-minimized manual hooks (backslashxx-based) using semantic patches, before any other kernel/manager patches touch the source.
inputs:
  kernel_version:
    required: true
    description: Kernel version being built (for logging only).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"

        echo "== installing Coccinelle =="
        sudo apt-get update -qq
        sudo apt-get install -y coccinelle
        spatch --version

        COCCI_DIR="${RUNNER_TEMP:-/tmp}/kernelsu-coccinelle"
        rm -rf "$COCCI_DIR"

        echo "== cloning devnoname120/kernelsu-coccinelle =="
        git clone --depth 1 https://github.com/devnoname120/kernelsu-coccinelle "$COCCI_DIR"

        COCCI_COMMIT="$(git -C "$COCCI_DIR" rev-parse --short HEAD)"
        echo "kernelsu-coccinelle commit: $COCCI_COMMIT"

        APPLY_SCRIPT="$COCCI_DIR/scope-minimized-hooks/apply.sh"
        if [ ! -f "$APPLY_SCRIPT" ]; then
          echo "::error::apply.sh not found at $APPLY_SCRIPT"
          exit 1
        fi
        chmod +x "$APPLY_SCRIPT"

        echo "== running scope-minimized-hooks apply.sh against $COMMON_DIR =="
        echo "(kernel_version=${{ inputs.kernel_version }})"

        cd "$COCCI_DIR/scope-minimized-hooks"
        ./apply.sh "$COMMON_DIR"

        echo
        echo "== diff stat after Coccinelle hook application =="
        git -C "$COMMON_DIR" diff --stat
