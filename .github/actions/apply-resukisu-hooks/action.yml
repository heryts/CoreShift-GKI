name: Apply ReSukiSU manual hooks
description: Apply ReSukiSU's required manual kernel hooks (stat, execve, faccessat, sys_reboot) and enable auto-hook config flags.
inputs:
  kernel_version:
    required: true
    description: Kernel version being built.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        PATCH_DIR="$GITHUB_WORKSPACE/.github/patches/resukisu"

        cd "$COMMON_DIR"

        echo "== applying ReSukiSU manual hooks =="

        apply_patch() {
          local patch_file="$1"
          local label="$2"

          if [ ! -f "$patch_file" ]; then
            echo "::error::missing patch file: $patch_file"
            exit 1
          fi

          echo "-- $label --"
          if ! git apply --check "$patch_file" 2>/tmp/patch_check_err; then
            echo "::error::$label patch does not apply cleanly to $COMMON_DIR"
            cat /tmp/patch_check_err
            echo "::error::This usually means the target file's surrounding context differs from the official ReSukiSU diff. Manual adjustment of the patch is required for this source tree."
            exit 1
          fi

          git apply "$patch_file"

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::reject files found after applying $label"
            find . -name '*.rej' -print
            exit 1
          fi
        }

        apply_patch "$PATCH_DIR/01_stat_hook.patch"      "stat hook"
        apply_patch "$PATCH_DIR/02_execve_hook.patch"    "execve hook"
        apply_patch "$PATCH_DIR/03_faccessat_hook.patch" "faccessat hook"
        apply_patch "$PATCH_DIR/04_reboot_hook.patch"    "sys_reboot hook"

        for f in fs/stat.c fs/exec.c fs/open.c kernel/reboot.c; do
          if grep -qE '^(<<<<<<< |=======$|>>>>>>> )' "$f"; then
            echo "::error::conflict markers found in $f after patching"
            exit 1
          fi
        done

        echo "== enabling ReSukiSU manual-hook config flags =="

        DEFCONFIG="arch/arm64/configs/gki_defconfig"
        if [ ! -f "$DEFCONFIG" ]; then
          echo "::error::gki_defconfig not found at $DEFCONFIG"
          exit 1
        fi

        add_config() {
          local cfg="$1"
          if grep -q "^${cfg}=y" "$DEFCONFIG"; then
            echo "  already set: $cfg"
          elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
            sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
            echo "  toggled on: $cfg"
          else
            echo "${cfg}=y" >> "$DEFCONFIG"
            echo "  appended: $cfg"
          fi
        }

        add_config CONFIG_KSU_MANUAL_HOOK
        add_config CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
        add_config CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK
        add_config CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
        add_config CONFIG_KALLSYMS_ALL

        echo "== ReSukiSU manual hook integration diff stat =="
        git diff --stat
