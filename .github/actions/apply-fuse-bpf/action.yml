name: "Apply FUSE-BPF support"
description: "Applies FUSE-BPF patch using local patch file or skips if natively present."

inputs:
  kernel_version:
    description: "Kernel version: 5.10, 6.1, or 6.6"
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply FUSE-BPF Patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        if [ -f "fs/fuse/backing.c" ] && grep -q "CONFIG_FUSE_BPF" "fs/fuse/Kconfig" 2>/dev/null; then
          echo "== FUSE-BPF source already present in this tree (native GKI support) =="
          echo "== Nothing to patch =="
          exit 0
        fi

        echo "== FUSE-BPF not found in source tree =="

        if [ "${{ inputs.kernel_version }}" != "5.10" ]; then
          echo "::error::FUSE-BPF is missing from kernel_version=${{ inputs.kernel_version }} source tree."
          exit 1
        fi

        PATCH_FILE="${GITHUB_WORKSPACE}/.github/patches/common/fuse-bpf/*.patch"

        if compgen -G "$PATCH_FILE" > /dev/null; then
          echo "== Applying local FUSE-BPF patch from .github/patches/common/fuse-bpf/ =="
          git apply --check $PATCH_FILE || patch -p1 --dry-run < $PATCH_FILE
          git apply $PATCH_FILE || patch -p1 < $PATCH_FILE
          echo "== FUSE-BPF patch applied successfully! =="
        else
          echo "::error::No patch file found in .github/patches/common/fuse-bpf/"
          exit 1
        fi
