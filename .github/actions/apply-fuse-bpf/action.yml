name: "Apply FUSE-BPF (backport to android12-5.10)"
description: >
  Fetches the upstream ANDROID: fuse-bpf v1.1 squash commit from
  common-android13-5.10 directly from android.googlesource.com/kernel/common
  at build time, generates a real patch against its actual parent commit,
  and applies it (3-way, falling back to --reject) onto the checked out
  android12-5.10 kernel/common tree. Only meaningful for kernel_version=5.10;
  android13+ based common trees (6.1/6.6) already contain FUSE_BPF natively.

inputs:
  kernel_version:
    description: "Kernel version being built (only 5.10 is backported)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Fetch and backport FUSE-BPF
      if: inputs.kernel_version == '5.10'
      shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        UPSTREAM_URL="https://android.googlesource.com/kernel/common"
        # ANDROID: fuse-bpf v1.1 squash, first landed on common-android13-5.10
        TARGET_COMMIT="f5f4199c102aa676998b42abff60d071385c1c0c"

        if [ ! -d "$COMMON_DIR/.git" ]; then
          echo "::error::$COMMON_DIR is not a git checkout; FUSE-BPF backport needs real history to diff against"
          exit 1
        fi

        mkdir -p "$PATCH_DIR"
        cd "$COMMON_DIR"

        echo "== applying FUSE-BPF patch =="
        git apply --whitespace=fix "$GITHUB_WORKSPACE/.github/patches/common/fuse-bpf/0001-ANDROID-fuse-bpf-v1.1-android12-5.10.patch"
        APPLY_STATUS=$?

        if [ "$APPLY_STATUS" -ne 0 ]; then
          git am --abort 2>/dev/null || true
          echo "::warning::3-way am failed cleanly; retrying with --reject so exact conflicts surface as .rej files"
          set +e
          git apply --reject --whitespace=fix "$PATCH_DIR/0001-ANDROID-fuse-bpf-v1.1-backport.patch"
          set -e

          if find . -name '*.rej' | grep -q .; then
            echo "::error::FUSE-BPF backport produced conflicts. Inspect *.rej files below, resolve them by hand in fs/fuse/, remove the .rej/.orig files, then re-run. The source patch is uploaded as an artifact for offline diffing."
            find . -name '*.rej' -print
            cp -r . "$PATCH_DIR/conflicted-tree" 2>/dev/null || true
            exit 1
          fi
        fi

        echo "fuse_bpf_applied=true" >> "$GITHUB_ENV"

    - name: Skip FUSE-BPF (not kernel 5.10)
      if: inputs.kernel_version != '5.10'
      shell: bash
      run: |
        echo "::notice::fuse_bpf requested but kernel_version=${{ inputs.kernel_version }}; skipping backport (android13+ based common trees already ship FUSE_BPF natively for source_mode=google-lts)."
