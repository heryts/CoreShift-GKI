name: "Apply FUSE-BPF (backport to android12-5.10)"
description: >
  Applies a pre-resolved, vendored FUSE-BPF v1.1 backport patch onto the
  checked out android12-5.10 kernel/common tree. The patch was generated once
  by manually resolving the real content conflicts between common-android13-5.10
  (where fuse-bpf v1.1 first landed) and android12-5.10-lts, so it applies
  deterministically as long as kernel/common is pinned (via common_ref in the
  sync-kernel action) to the exact commit the patch was resolved against.
  Only meaningful for kernel_version=5.10; android13+ based common trees
  (6.1/6.6) already contain FUSE_BPF natively.

inputs:
  kernel_version:
    description: "Kernel version being built (only 5.10 is backported)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply vendored FUSE-BPF patch
      if: inputs.kernel_version == '5.10'
      shell: bash
      run: |
        set -euo pipefail

        COMMON_DIR="${KERNEL_COMMON_DIR:-$GITHUB_WORKSPACE/kernel/common}"
        PATCH_FILE="$GITHUB_WORKSPACE/.github/patches/common/fuse-bpf/0001-ANDROID-fuse-bpf-v1.1-android12-5.10.patch"

        if [ ! -d "$COMMON_DIR" ]; then
          echo "::error::$COMMON_DIR does not exist; is kernel/common checked out yet?"
          exit 1
        fi

        if [ ! -f "$PATCH_FILE" ]; then
          echo "::error::vendored patch not found at $PATCH_FILE"
          exit 1
        fi

        cd "$COMMON_DIR"

        echo "== checking vendored FUSE-BPF patch applies cleanly =="
        if ! git apply --check --whitespace=fix "$PATCH_FILE"; then
          echo "::error::Vendored FUSE-BPF patch no longer applies cleanly onto kernel/common."
          echo "::error::This almost always means kernel/common has drifted from the commit the"
          echo "::error::patch was resolved against. Check that common_ref in the sync-kernel step"
          echo "::error::is still pinned to the commit used when this patch was generated, or"
          echo "::error::re-resolve the conflicts against the new base and re-vendor the patch."
          exit 1
        fi

        git apply --whitespace=fix "$PATCH_FILE"

        if find . -name '*.rej' -o -name '*.orig' | grep -q .; then
          echo "::error::Unexpected .rej/.orig files left behind after apply; tree may be inconsistent."
          find . -name '*.rej' -o -name '*.orig' -print
          exit 1
        fi

        echo "== FUSE-BPF applied cleanly. CONFIG_FUSE_BPF itself is enabled via"
        echo "   private.fragment by the create-config-fragment action (fuse_bpf input) - not here."

        echo "fuse_bpf_applied=true" >> "$GITHUB_ENV"

    - name: Skip FUSE-BPF (not kernel 5.10)
      if: inputs.kernel_version != '5.10'
      shell: bash
      run: |
        echo "::notice::fuse_bpf requested but kernel_version=${{ inputs.kernel_version }}; skipping backport (android13+ based common trees already ship FUSE_BPF natively for source_mode=google-lts)."
